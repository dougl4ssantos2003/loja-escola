<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Confirmação da compra simulada da Loja Escola.">
  <title>Loja Escola | Compra concluída</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo principal</a>
  
  <div id="header-container"></div>

  <main id="conteudo" class="container py-5">
    <section class="success-panel mx-auto text-center" aria-labelledby="titulo-sucesso">
      <div class="success-icon" aria-hidden="true">✓</div>
      <p class="eyebrow">Pedido simulado concluído</p>
      <h1 id="titulo-sucesso">Compra concluída com sucesso!</h1>
      <p class="lead" id="mensagemCliente">Seus dados foram validados e o fluxo educacional chegou ao final.</p>
      <dl class="order-data">
        <div><dt>Número do pedido</dt><dd id="numeroPedido">PED-000000</dd></div>
        <div><dt>Status</dt><dd>Simulação concluída</dd></div>
      </dl>
      <a class="btn btn-dark" href="index.html">Voltar para a loja</a>
    </section>
  </main>

  <footer class="site-footer py-4"><div class="container"><p class="mb-0">Loja Escola · Nenhuma cobrança real foi realizada.</p></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/success.js"></script>
  <script src="js/header.js"></script>
</body>
</html>
